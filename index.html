<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makieta rezerwacji - Trening Personalny</title>
    <style>
        /* Podstawowe resetowanie stylów */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        /* Sekcja Hero */
        .hero-section {
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 80px 20px;
        }

        .hero-section h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hero-section p {
            font-size: 1.2rem;
            color: #cccccc;
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        .hero-btn {
            display: inline-block;
            background-color: #e63946;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .hero-btn:hover {
            background-color: #d62828;
        }

        /* Sekcja Rezerwacji */
        .booking-section {
            max-width: 900px;
            margin: 60px auto;
            padding: 40px 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }

        .booking-section h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .booking-section p {
            color: #666;
            margin-bottom: 30px;
        }

        /* Miejsce na widget (iframe) */
        .widget-container {
            min-height: 400px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            /* Usuniesz to szare tło i obramowanie, gdy wkleisz prawdziwy kod widgetu */
            background-color: #fafafa; 
        }

        /* Stopka */
        footer {
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            padding: 30px 20px;
            margin-top: 50px;
        }

        footer p {
            margin-bottom: 15px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-links a {
            color: #e63946;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: #fff;
        }

        /* RWD - responsywność dla telefonów */
        @media (max-width: 768px) {
            .hero-section h1 { font-size: 2rem; }
            .booking-section { margin: 30px 15px; padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Sekcja Hero -->
    <div class="hero-section">
        <h1>Makieta Rezerwacji</h1>
        <p>Zbuduj formę życia. Wybierz dogodny termin, zapisz się w 30 sekund i widzimy się na treningu.</p>
        <a href="#booking" class="hero-btn">Umów Trening</a>
    </div>

    <!-- Sekcja Rezerwacji -->
    <div id="booking" class="booking-section">
        <h2>Wybierz termin</h2>
        <p>Znajdź wolną datę w kalendarzu poniżej.</p>
        
        <!-- TUTAJ WKLEJ KOD Z CALENDLY LUB ZCAL -->
        <div class="widget-container">
            <p>Tutaj wkleisz kod z Calendly / Zcal</p>
        </div>
        <!-- KONIEC MIEJSCA NA WIDGET -->

    </div>

    <!-- Stopka -->
    <footer>
        <p>&copy; 2026 Trening Personalny. Wszelkie prawa zastrzeżone.</p>
        <div class="social-links">
            <a href="#" target="_blank">Instagram</a>
            <a href="#" target="_blank">Facebook</a>
        </div>
    </footer>

</body>
</html>
